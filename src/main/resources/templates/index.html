<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,"/>
    <title>방탈출 예약 — 웰컴</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/site :: siteHeader}"></header>
<main>
    <h1>방탈출 예약 서비스</h1>
    <p class="lead">관리자는 시간·테마·예약을 관리하고, 사용자는 날짜와 테마를 골라 직접 예약할 수 있습니다.</p>
    <div class="panel">
        <h2>로그인</h2>
        <div class="form-row">
            <label>아이디
                <input type="text" id="loginId" placeholder="아이디"/>
            </label>
            <label>비밀번호
                <input type="password" id="password" placeholder="비밀번호"/>
            </label>
            <button type="button" class="btn btn-primary" id="loginBtn">로그인</button>
        </div>
        <p id="loginStatus" class="status-msg" style="display:none;"></p>
    </div>
    <div class="card-grid" id="quickLinks" style="display:none;">
        <article class="card" id="cardAdmin" style="display:none;">
            <h2>관리자 페이지</h2>
            <p>예약 시간, 테마, 전체 예약 목록을 등록하고 삭제합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/admin}">관리자로 이동</a>
        </article>
        <article class="card" id="cardManager" style="display:none;">
            <h2>매니저 페이지</h2>
            <p>담당 매장의 테마와 예약을 관리합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/manager}">매니저로 이동</a>
        </article>
        <article class="card" id="cardUser" style="display:none;">
            <h2>사용자 페이지</h2>
            <p>매장을 선택하고 날짜·테마·시간을 골라 예약합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/user}">사용자로 이동</a>
        </article>
    </div>
</main>
<div th:replace="~{fragments/site :: errorModal}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    const ERROR_MESSAGES = {
        INVALID_INPUT: '입력값이 올바르지 않습니다.',
        UNAUTHORIZED: '아이디 또는 비밀번호가 올바르지 않습니다.',
        INTERNAL_SERVER_ERROR: '서버 내부 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',
    };

    async function readApiError(res) {
        const text = await res.text();
        if (!text) return '요청 실패 (' + res.status + ')';
        try {
            const j = JSON.parse(text);
            if (j && j.errorCode && ERROR_MESSAGES[j.errorCode]) return ERROR_MESSAGES[j.errorCode];
            if (j && j.message) return j.message;
        } catch (_) {}
        return text || '요청 실패 (' + res.status + ')';
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const loginId = document.getElementById('loginId').value.trim();
        const password = document.getElementById('password').value;
        const status = document.getElementById('loginStatus');
        status.style.display = 'none';

        if (!loginId || !password) {
            showErrorModal('아이디와 비밀번호를 입력해 주세요.');
            return;
        }

        try {
            // 1. 로그인 (세션 쿠키 발급)
            const loginRes = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({loginId, password})
            });
            if (!loginRes.ok) throw new Error(await readApiError(loginRes));

            // 2. 내 정보 조회 (role, managingShopId)
            const meRes = await fetch('/users/me');
            if (!meRes.ok) throw new Error('사용자 정보를 불러오지 못했습니다.');
            const user = await meRes.json();

            // 3. sessionStorage에 저장
            sessionStorage.setItem('currentUser', JSON.stringify({
                id: user.id,
                role: user.role,
                managingShopId: user.managingShopId || null
            }));
            // 매니저는 자신의 매장을 선택된 매장으로 자동 설정
            if (user.role === 'MANAGER' && user.managingShopId) {
                // 매장명은 user 페이지에서 조회
                sessionStorage.setItem('selectedShop', JSON.stringify({
                    id: user.managingShopId,
                    name: null
                }));
            } else {
                // 다른 역할은 기존 선택 초기화
                sessionStorage.removeItem('selectedShop');
            }

            // 4. 역할에 따라 페이지 이동
            if (user.role === 'ADMIN') {
                location.href = '/view/admin';
            } else if (user.role === 'MANAGER') {
                location.href = '/view/manager';
            } else {
                location.href = '/view/user';
            }
        } catch (e) {
            showErrorModal(e.message);
        }
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // 이미 로그인되어 있으면 퀵링크 카드 표시
    (function showQuickLinks() {
        const user = getCurrentUser();
        if (!user) return;
        const grid = document.getElementById('quickLinks');
        grid.style.display = '';
        if (user.role === 'ADMIN') {
            document.getElementById('cardAdmin').style.display = '';
            document.getElementById('cardUser').style.display = '';
        } else if (user.role === 'MANAGER') {
            document.getElementById('cardManager').style.display = '';
            document.getElementById('cardUser').style.display = '';
        } else {
            document.getElementById('cardUser').style.display = '';
        }
    })();
</script>
</body>
</html>
