<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,"/>
    <title>매니저 — 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/site :: siteHeader}"></header>
<main>
    <h1>매니저</h1>
    <div class="panel" id="shopInfoPanel">
        <h2>담당 매장</h2>
        <p id="shopName" class="lead">불러오는 중…</p>
        <p id="shopId" class="muted"></p>
    </div>
    <div class="card-grid">
        <article class="card">
            <h2>예약 관리</h2>
            <p>담당 매장의 예약을 조회하고 삭제합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/manager/reservations}">예약 목록</a>
        </article>
        <article class="card">
            <h2>사용자 기능</h2>
            <p>담당 매장에서 직접 예약하거나 인기 테마를 확인합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/user}">사용자 페이지</a>
        </article>
    </div>
</main>
<div th:replace="~{fragments/site :: errorModal}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    // MANAGER 전용 페이지
    if (!requireRole('MANAGER')) {
        throw new Error('unreachable');
    }

    const user = getCurrentUser();

    async function loadShopInfo() {
        try {
            const res = await fetch('/shops/managed');
            if (!res.ok) throw new Error('매장 정보를 불러오지 못했습니다.');
            const shop = await res.json();
            document.getElementById('shopName').textContent = shop.name;
            document.getElementById('shopId').textContent = 'ID: ' + shop.id;

            // selectedShop 갱신 (이름 포함)
            setSelectedShop(shop.id, shop.name);
        } catch (e) {
            document.getElementById('shopName').textContent = '매장 정보 조회 실패';
            showErrorModal(e.message);
        }
    }

    loadShopInfo();
</script>
</body>
</html>
