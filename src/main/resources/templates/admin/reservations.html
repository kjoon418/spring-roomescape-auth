<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,"/>
    <title>관리자 — 예약</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/site :: siteHeader}"></header>
<main>
    <h1>예약 목록</h1>
    <p class="muted"><a th:href="@{/view/admin}">← 관리자 홈</a></p>
    <p class="muted" id="shopLabel"></p>
    <div class="panel">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>예약자</th>
                <th>날짜</th>
                <th>시작</th>
                <th>테마</th>
                <th>취소 여부</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="muted" style="display:none;">등록된 예약이 없습니다.</p>
        <p id="err" class="status-msg err" style="display:none;"></p>
    </div>
    <details class="dev-panel">
        <summary>🧪 에러 응답 테스트</summary>
        <p class="trigger-desc">존재하지 않는 UUID로 예약 삭제를 시도합니다. → <code>RESERVATION_NOT_FOUND</code></p>
        <div class="form-row">
            <button type="button" class="btn btn-test" id="triggerErrBtn">존재하지 않는 예약 삭제 시도</button>
        </div>
        <p id="testErr" class="status-msg" style="display:none;"></p>
    </details>
</main>
<div th:replace="~{fragments/site :: errorModal}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    const _shop = requireAdminShop();
    if (!_shop) throw new Error('unreachable');
    const SHOP_ID = _shop.id;

    document.getElementById('shopLabel').textContent = '매장: ' + (_shop.name || SHOP_ID);

    const tbody = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const err = document.getElementById('err');

    const ERROR_MESSAGES = {
        BAD_REQUEST: '잘못된 요청입니다.',
        RESERVATION_NOT_FOUND: '해당 예약을 찾을 수 없습니다.',
        DATABASE_ERROR: '데이터베이스 오류가 발생했습니다.',
        INTERNAL_SERVER_ERROR: '서버 내부 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.',
    };

    async function readApiError(res) {
        const text = await res.text();
        if (!text) return '요청 실패 (' + res.status + ')';
        try {
            const j = JSON.parse(text);
            if (j && j.errorCode && ERROR_MESSAGES[j.errorCode]) return ERROR_MESSAGES[j.errorCode];
            if (j && j.message) return j.message;
        } catch (_) {}
        return text || '요청 실패 (' + res.status + ')';
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    async function load() {
        err.style.display = 'none';
        try {
            const res = await fetch(`/admin/reservations?shopId=${SHOP_ID}`);
            if (!res.ok) throw new Error(await readApiError(res));
            const list = await res.json();
            tbody.innerHTML = '';
            empty.style.display = list.length ? 'none' : 'block';
            for (const r of list) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-size:0.75rem;word-break:break-all;">${escapeHtml(r.id)}</td>
                    <td>${escapeHtml(r.userName)}</td>
                    <td>${escapeHtml(r.date)}</td>
                    <td>${escapeHtml(r.time ? r.time.startAt : '')}</td>
                    <td>${escapeHtml(r.theme ? r.theme.name : '')}</td>
                    <td style="color:${r.canceled ? 'var(--danger)' : 'var(--success)'}">
                        ${r.canceled ? '취소됨' : '정상'}
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger" data-id="${escapeHtml(r.id)}"
                            ${r.canceled ? 'disabled' : ''}>삭제</button>
                    </td>`;
                tbody.appendChild(tr);
            }
            tbody.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', () => deleteReservation(btn.dataset.id));
            });
        } catch (e) {
            showErrorModal(e.message);
        }
    }

    async function deleteReservation(id) {
        if (!confirm('이 예약을 삭제할까요?')) return;
        err.style.display = 'none';
        try {
            const res = await fetch(`/admin/reservations/${id}?shopId=${SHOP_ID}`, {method: 'DELETE'});
            if (!res.ok) throw new Error(await readApiError(res));
            await load();
        } catch (e) {
            showErrorModal(e.message);
        }
    }

    load();

    document.getElementById('triggerErrBtn').addEventListener('click', async () => {
        const testErr = document.getElementById('testErr');
        testErr.style.display = 'none';
        try {
            const res = await fetch(
                `/admin/reservations/00000000-0000-0000-0000-000000000000?shopId=${SHOP_ID}`,
                {method: 'DELETE'}
            );
            if (!res.ok) throw new Error(await readApiError(res));
            testErr.textContent = '성공 응답을 받았습니다.';
            testErr.className = 'status-msg ok';
            testErr.style.display = 'block';
        } catch (e) {
            showErrorModal(e.message);
        }
    });
</script>
</body>
</html>
