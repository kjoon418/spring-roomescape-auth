<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,"/>
    <title>관리자 — 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header th:replace="~{fragments/site :: siteHeader}"></header>
<main>
    <h1>관리자</h1>

    <!-- 매장 선택 패널 -->
    <div class="panel" id="shopSelectPanel" style="display:none;">
        <h2>매장 선택</h2>
        <p class="muted">관리할 매장을 선택하세요.</p>
        <div id="shopList" class="card-grid"></div>
        <p id="shopLoading" class="muted">매장 목록을 불러오는 중…</p>
        <p id="shopEmpty" class="muted" style="display:none;">등록된 매장이 없습니다.</p>
    </div>

    <!-- 현재 선택된 매장 -->
    <div class="panel" id="selectedShopPanel" style="display:none;">
        <h2>선택된 매장</h2>
        <p id="selectedShopName" class="lead"></p>
        <button type="button" class="btn" id="changeShopBtn">매장 변경</button>
    </div>

    <!-- 관리 기능 카드 (매장 선택 후 표시) -->
    <div class="card-grid" id="featureCards" style="display:none;">
        <article class="card">
            <h2>예약 시간</h2>
            <p>시작 시각을 등록하고 삭제합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/admin/times}">시간 관리</a>
        </article>
        <article class="card">
            <h2>테마</h2>
            <p>테마를 추가·삭제합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/admin/themes}">테마 관리</a>
        </article>
        <article class="card">
            <h2>예약</h2>
            <p>선택한 매장의 예약을 조회하고 삭제합니다.</p>
            <a class="btn btn-primary" th:href="@{/view/admin/reservations}">예약 목록</a>
        </article>
    </div>
</main>
<div th:replace="~{fragments/site :: errorModal}"></div>
<script th:src="@{/js/common.js}"></script>
<script>
    // 관리자 전용
    if (!requireRole('ADMIN')) throw new Error('unreachable');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    async function loadShops() {
        const shopLoading = document.getElementById('shopLoading');
        const shopEmpty = document.getElementById('shopEmpty');
        const shopList = document.getElementById('shopList');
        shopLoading.style.display = 'block';
        shopEmpty.style.display = 'none';
        shopList.innerHTML = '';
        try {
            const res = await fetch('/shops');
            if (!res.ok) throw new Error('매장 목록 조회 실패');
            const shops = await res.json();
            shopLoading.style.display = 'none';
            if (!shops.length) { shopEmpty.style.display = 'block'; return; }
            for (const shop of shops) {
                const card = document.createElement('article');
                card.className = 'card';
                card.style.cursor = 'pointer';
                card.innerHTML = `<h2>${escapeHtml(shop.name)}</h2><p>이 매장을 관리합니다.</p>`;
                card.addEventListener('click', () => selectShop(shop.id, shop.name));
                shopList.appendChild(card);
            }
        } catch (e) {
            shopLoading.style.display = 'none';
            showErrorModal(e.message);
        }
    }

    function selectShop(id, name) {
        setSelectedShop(id, name);
        showSelectedState({ id, name });
    }

    function showSelectedState(shop) {
        document.getElementById('shopSelectPanel').style.display = 'none';
        document.getElementById('selectedShopPanel').style.display = 'block';
        document.getElementById('selectedShopName').textContent = shop.name || shop.id;
        document.getElementById('featureCards').style.display = 'grid';
    }

    document.getElementById('changeShopBtn').addEventListener('click', () => {
        sessionStorage.removeItem('selectedShop');
        document.getElementById('selectedShopPanel').style.display = 'none';
        document.getElementById('featureCards').style.display = 'none';
        document.getElementById('shopSelectPanel').style.display = 'block';
        loadShops();
    });

    const selected = getSelectedShop();
    if (selected && selected.id) {
        showSelectedState(selected);
    } else {
        document.getElementById('shopSelectPanel').style.display = 'block';
        loadShops();
    }
</script>
</body>
</html>
